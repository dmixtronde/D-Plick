name: Build Android APK
on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cấp quyền thực thi cho Gradle
        run: chmod +x gradlew

      - name: Chạy lệnh Build APK
        run: ./gradlew assembleDebug

      - name: Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: D-Plick-APK
          path: app/build/outputs/apk/debug/app-debug.apk
